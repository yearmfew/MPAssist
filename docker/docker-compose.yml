# Defines the version of the Docker Compose file format
# version: '3.8'  # Obsolete, removed

# Defines the services (containers) that make up the application
services:

  # MPAssist Gradio Web Application
  mpassist-app:
    # Build the image from the Dockerfile in the docker directory
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mpassist_app
    # Use root .env file for environment variables
    env_file:
      - ../.env
    environment:
      - ANONYMIZED_TELEMETRY=False
      - DB_PATH=/app/db
    # Mount src for hot-reload during development
    volumes:
      - ../src:/app/src
      - ../logs:/app/logs
    # Expose Gradio port
    ports:
      - "7860:7860"
    # Keep container running
    tty: true
    stdin_open: true
